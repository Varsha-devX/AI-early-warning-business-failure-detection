version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: corporate_health_db
    environment:
      POSTGRES_DB: corporate_health
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: changeme_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d corporate_health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # Backend (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: corporate_health_backend
    environment:
      - DATABASE_URL=postgresql://admin:changeme_secure_password@postgres:5432/corporate_health
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-2.5-pro
      - UPLOAD_DIR=/app/uploads
      - REPORTS_DIR=/app/reports
      - TRAINED_MODELS_DIR=/app/trained_models
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
      - DEBUG=false
    volumes:
      - uploads_data:/app/uploads
      - reports_data:/app/reports
      - models_data:/app/trained_models
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  # Frontend (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: corporate_health_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app_network
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  reports_data:
  models_data:

networks:
  app_network:
    driver: bridge
